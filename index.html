<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Molino IoT Dashboard</title>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>

        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body
        {
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;
        }

        .dashboard
        {
            width: 100%;
            max-width: 1200px;
        }

        .title
        {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1
        {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .title p
        {
            color: #94a3b8;
            font-size: 18px;
        }

        .grid
        {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 25px;
        }

        .card
        {
            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 20px;

            padding: 30px;

            backdrop-filter: blur(10px);

            transition: 0.3s;
        }

        .card:hover
        {
            transform: translateY(-5px);

            border-color: #38bdf8;
        }

        .card-title
        {
            font-size: 20px;
            color: #cbd5e1;

            margin-bottom: 20px;
        }

        .value
        {
            font-size: 60px;
            font-weight: bold;
        }

        .unit
        {
            color: #38bdf8;
            font-size: 20px;
        }

        .status
        {
            margin-top: 20px;

            display: inline-block;

            padding: 8px 15px;

            border-radius: 50px;

            background: #22c55e;

            color: white;

            font-size: 14px;
        }

        .footer
        {
            margin-top: 40px;

            text-align: center;

            color: #94a3b8;
        }

    </style>
</head>

<body>

<div class="dashboard">

    <div class="title">
        <h1>🌊 Molino IoT</h1>
        <p>Monitorización en tiempo real mediante ESP32 + MQTT</p>
    </div>

    <div class="grid">

        <div class="card">

            <div class="card-title">
                RPM DEL MOLINO
            </div>

            <div class="value">
                <span id="rpm">0</span>
                <span class="unit">RPM</span>
            </div>

            <div class="status">
                Tiempo real
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                PERIODO ENTRE EVENTOS
            </div>

            <div class="value">
                <span id="period">0</span>
                <span class="unit">us</span>
            </div>

            <div class="status">
                Timer ISR
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                CAUDAL ESTIMADO
            </div>

            <div class="value">
                <span id="flow">0</span>
                <span class="unit">L/min</span>
            </div>

            <div class="status">
                Calculado
            </div>

        </div>

    </div>

    <div class="footer">
        ESP32-S3 · FreeRTOS · MQTT · GitHub Pages
    </div>

</div>

<script>

const client = mqtt.connect(
    "wss://broker.emqx.io:8084/mqtt"
);

client.on("connect", function ()
{
    console.log("MQTT conectado");

    client.subscribe("molino/rpm");
    client.subscribe("molino/periodo");
    client.subscribe("molino/caudal");
});

client.on("message", function (topic, message)
{
    const value = message.toString();

    console.log(topic + ": " + value);

    if (topic === "molino/rpm")
    {
        document.getElementById("rpm").innerText = value;
    }

    if (topic === "molino/periodo")
    {
        document.getElementById("period").innerText = value;
    }

    if (topic === "molino/caudal")
    {
        document.getElementById("flow").innerText = value;
    }
});

client.on("error", function (err)
{
    console.log(err);
});

</script>

</body>
</html>
